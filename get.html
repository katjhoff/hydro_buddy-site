<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join my SipSquad</title>
  
  <!-- Matching your app's Nunito font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F9FAFB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      background: #FFFFFF;
      padding: 40px 24px;
      border-radius: 28px; /* Matches your Flutter dialog radius */
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      max-width: 380px;
      width: 100%;
      box-sizing: border-box;
    }
    .app-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0, 122, 255, 0.2);
      background-color: #007AFF;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 { 
      color: #1C274C; /* Your AppTheme.primaryDark */
      font-size: 26px; 
      font-weight: 900; 
      margin: 0 0 12px 0; 
      letter-spacing: -0.5px;
    }
    p { 
      color: #64748B; /* Matches your Flutter subtitle text */
      font-size: 15px; 
      font-weight: 600; 
      margin: 0 0 32px 0; 
      line-height: 1.5; 
    }
    .code-container {
      background: #F1F5F9; /* Matches your TextField background */
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 32px;
    }
    .code-label {
      font-size: 11px;
      font-weight: 800;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: block;
    }
    .code-box {
      color: #1C274C;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 8px; /* Matches your CupertinoTextField */
      margin: 0;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 18px;
      border-radius: 28px; /* Matches your ElevatedButton */
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
      transition: transform 0.2s, opacity 0.2s;
      border: none;
    }
    .btn-apple { 
      background: #1C274C; 
      color: #FFFFFF; 
    }
    .btn-google { 
      background: #007AFF; /* Your primary blue */
      color: #FFFFFF; 
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.25);
    }
    .btn:active { transform: scale(0.97); }
    
    /* Store icons inside buttons */
    .btn svg {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-icon">
      <!-- Reusing the logo from your index.html -->
      <img src="images/logoimage.png" alt="SipWorld App Icon" onerror="this.style.display='none'">
    </div>
    
    <h1>Join my SipSquad</h1>
    <p>I invited you to team up and track our hydration together on SipWorld.</p>
    
    <div class="code-container">
      <span class="code-label">Your Invite Code</span>
      <div class="code-box" id="invite-code">------</div>
    </div>
    
    <!-- You will need to add your actual Apple App Store URL here once published -->
    <a href="#" class="btn btn-apple">
      <svg viewBox="0 0 384 512"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      Get on App Store
    </a>
    <a href="https://play.google.com/store/apps/details?id=com.pocketenginestudio.hydrobuddy" class="btn btn-google">
      <svg viewBox="0 0 512 512"><path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
      Get on Google Play
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const groupId = params.get('groupId') || params.get('code'); 
    
    document.getElementById('invite-code').innerText = groupId ? groupId : "NO CODE";
    
    // If they have the app, this forces the device to try and open it
    if (groupId) {
       setTimeout(() => { window.location.href = `sipworld://squad?groupId=${groupId}`; }, 500);
    }
  </script>
</body>
</html>
